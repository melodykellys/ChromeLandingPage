<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Landing Page</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="page-shell">
        <header class="top-bar">
            <a class="github-link" href="https://github.com/LOGESH-B" aria-label="GitHub profile">
                <img src="./github-icon.svg" alt="GitHub" width="28" height="28">
            </a>
            <div class="toolbar-actions">
                <button id="swap-search-engine" type="button" title="Change search engine" aria-label="Change search engine">
                    <img src="./swap.svg" alt="Swap search engine" width="18" height="18">
                </button>
                <button id="swap-button" type="button" title="Change time format" aria-label="Change time format">
                    <img src="./swap.svg" alt="Swap time format" width="18" height="18">
                </button>
            </div>
        </header>

        <main class="center-div">
            <div class="welcome-card">
                <p class="greeting" id="greeting">Good evening</p>
                <div class="systemTime" id="systemTime"></div>
                <div class="systemDate" id="systemDate"></div>
            </div>

            <form id="form" class="search-form" autocomplete="off">
                <label class="search-wrap" for="input">
                    <img id="search-engine-icon" src="./google-icon.svg" alt="Search engine" width="26" height="26" />
                    <input class="search" type="text" id="input" placeholder="Search the web" name="search" autocomplete="off" />
                </label>
                <button class="search-submit" type="submit">Search</button>
            </form>

            <aside class="weather-widget" id="weather-widget" aria-live="polite">
                <div class="weather-header">
                    <span class="weather-label">Weather</span>
                    <span class="weather-location" id="weather-location">Locating…</span>
                </div>
                <div class="weather-main">
                    <div class="weather-icon" id="weather-icon">☀️</div>
                    <div class="weather-temp-block">
                        <div class="weather-temp" id="weather-temp">--°</div>
                        <div class="weather-condition" id="weather-condition">Loading…</div>
                    </div>
                </div>
                <div class="weather-meta">
                    <span>Wind <strong id="weather-wind">-- km/h</strong></span>
                    <span>Humidity <strong id="weather-humidity">--%</strong></span>
                </div>
            </aside>
        </main>

        <div class="botom">
            <ul id="quick-links" class="qul" aria-label="Quick links"></ul>
        </div>

        <div class="addform" id="addform" style="display: none;">
            <form id="form1" class="link-form">
                <input type="text" placeholder="Title" name="title" id="title" autocomplete="off">
                <input type="text" placeholder="Image Link" name="img" id="img" autocomplete="off">
                <input type="text" placeholder="Site Link" name="link" id="link" autocomplete="off">
                <button type="submit">Add Link</button>
            </form>
        </div>
    </div>

    <script src="scrip.js"></script>
</body>
</html>
